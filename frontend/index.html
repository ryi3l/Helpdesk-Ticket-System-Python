<!DOCTYPE html>
<html>
<head>
    <title>Helpdesk Ticket System</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <div class="tickets">
        <div id="notification-container"></div>
        <h1>Helpdesk Ticket System</h1>

        <p id="welcome-message">Welcome to the ticket management system.</p>

        <h2 id="tickets-heading">Tickets</h2>

        <div id="tickets-container"></div>

        <button id="refresh-button" class="primary-button"> Refresh Tickets</button>
        <button id="update-button" class="primary-button">Update Ticket</button>
        <div id="update-ticket-container"></div>
        <button id="remove-button" class="primary-button">Remove Ticket</button>
        <div id="remove-ticket-container"></div>
    </div>

    <div class="ticket-form">
        <h2>Create Ticket</h2>

        <form id="create-ticket-form">
            <label for="title">Title</label>
            <input type="text" id="title">

            <label for="description">Description</label>
            <input type="text" id="description">

            <label for="assigned-to">Assigned To</label>
            <input type="text" id="assigned-to">

            <label for="priority">Priority</label>
            <select id="priority">
                <option>LOW</option>
                <option>MEDIUM</option>
                <option>HIGH</option>
                <option>URGENT</option>
            </select>

            <button id="create-button" class="primary-button" type="submit" >Create Ticket</button>
        </form>
    </div>

</body>

</html>
